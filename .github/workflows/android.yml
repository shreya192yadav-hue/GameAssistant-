name: Game Assistant Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q game_assistant_flutter_project.zip -d extracted

          PROJECT_ROOT=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Project found: $PROJECT_ROOT"

          rsync -a "$PROJECT_ROOT/" ./ \
            --exclude ".git/" \
            --exclude ".github/"

          rm -rf extracted

      - name: Fix known Dart errors
        shell: bash
        run: |
          set -e

          FILE="lib/services/direction_service.dart"

          if [ -f "$FILE" ]; then

            # Fix incorrect atan2 usage
            sed -i 's/e\.x\.atan2(e\.y)/atan2(e.x, e.y)/g' "$FILE"

            # Add dart:math if missing
            if ! grep -q "import 'dart:math';" "$FILE"; then
              sed -i "1i import 'dart:math';" "$FILE"
            fi
          fi

          # Remove obsolete default Flutter test
          rm -f test/widget_test.dart

      - name: Prepare Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms=android
          fi

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Assistant-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Complete
        run: |
          echo "======================================"
          echo " GAME ASSISTANT APK BUILD COMPLETE "
          echo "======================================"
