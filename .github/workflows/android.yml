name: Game Assistant Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # --------------------------------------------------
      # 4. Check uploaded ZIP
      # --------------------------------------------------
      - name: Check project ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "game_assistant_flutter_project.zip" ]; then
            echo "ERROR: game_assistant_flutter_project.zip not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Project ZIP found successfully."


      # --------------------------------------------------
      # 5. Extract Flutter project
      # --------------------------------------------------
      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q game_assistant_flutter_project.zip -d extracted

          echo "Searching for pubspec.yaml..."

          PROJECT_ROOT=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: pubspec.yaml was not found inside ZIP."
            find extracted -maxdepth
