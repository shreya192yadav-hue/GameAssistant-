name: Game Assistant Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Game Assistant APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Game Assistant project
        shell: bash
        run: |
          set -e

          test -f game_assistant_flutter_project.zip

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q game_assistant_flutter_project.zip -d extracted_project

          PROJECT_DIR=$(find extracted_project -type f -name pubspec.yaml -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -rf extracted_project

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Flutter project detected successfully."

      - name: Fix direction service
        shell: bash
        run: |
          set -e

          FILE="lib/services/direction_service.dart"

          if [ -f "$FILE" ]; then
            sed -i 's/e\.x\.atan2(e\.y)/atan2(e.x, e.y)/g' "$FILE"

            if ! grep -q "import 'dart:math';" "$FILE"; then
              sed -i "1i import 'dart:math';" "$FILE"
            fi
          fi

          echo "Direction service checked."

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            flutter create . --platforms=android --no-pub
          else
            echo "Android folder already exists."
          fi

      - name: Prepare Flutter Gradle wrapper
        shell: bash
        run: |
          set -e

          TEMP_DIR="$RUNNER_TEMP/flutter_android_template"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          cd "$TEMP_DIR"

          flutter create . --platforms=android --no-pub

          cd "$GITHUB_WORKSPACE"

          mkdir -p android/gradle/wrapper

          cp "$TEMP_DIR/android/gradlew" \
             android/gradlew

          cp "$TEMP_DIR/android/gradlew.bat" \
             android/gradlew.bat

          cp "$TEMP_DIR/android/gradle/wrapper/gradle-wrapper.jar" \
             android/gradle/wrapper/gradle-wrapper.jar

          cp "$TEMP_DIR/android/gradle/wrapper/gradle-wrapper.properties" \
             android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "Gradle wrapper ready."

      - name: Fix Flutter Gradle settings
        shell: bash
        run: |
          set -e

          FLUTTER_SDK_PATH="$(flutter sdk-path)"

          echo "Flutter SDK:"
          echo "$FLUTTER_SDK_PATH"

          cat > android/settings.gradle <<'EOF'
pluginManagement {
    includeBuild("PLACEHOLDER_FLUTTER_SDK/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
EOF

          sed -i \
            "s|PLACEHOLDER_FLUTTER_SDK|$FLUTTER_SDK_PATH|g" \
            android/settings.gradle

          echo "settings.gradle fixed."

      - name: Remove default Flutter test
        shell: bash
        run: |
          set -e

          rm -f test/widget_test.dart

          echo "Default widget test removed."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze lib

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Assistant-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
