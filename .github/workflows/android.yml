name: Game Assistant APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Game Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract Game Assistant ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Game Assistant ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project \
            -type f \
            -name pubspec.yaml \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -rf extracted_project

      - name: Verify Flutter project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android

          echo "Game Assistant project detected."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then

            TEMP_DIR="$RUNNER_TEMP/flutter_android_template"

            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            cd "$TEMP_DIR"

            flutter create . --platforms=android --no-pub

            cd "$GITHUB_WORKSPACE"

            mkdir -p android/gradle/wrapper

            cp "$TEMP_DIR/android/gradlew" android/gradlew
            cp "$TEMP_DIR/android/gradlew.bat" android/gradlew.bat
            cp "$TEMP_DIR/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            cp "$TEMP_DIR/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties

            chmod +x android/gradlew
          fi

          echo "Gradle wrapper ready."

      - name: Remove default Flutter test
        shell: bash
        run: |
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze lib

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Assistant-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
