name: Game Assistant Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          unzip -o game_assistant_flutter_project.zip -d project

          PROJECT_DIR=$(find project -name pubspec.yaml -type f | head -1 | xargs dirname)

          echo "Project directory: $PROJECT_DIR"

          cp -r "$PROJECT_DIR"/. .

          rm -rf project

      - name: Remove default Flutter test
        run: |
          rm -f test/widget_test.dart

      - name: Fix direction service
        run: |
          FILE="lib/services/direction_service.dart"

          if [ -f "$FILE" ]; then
            sed -i 's/e\.x\.atan2(e\.y)/atan2(e.x, e.y)/g' "$FILE"

            grep -q "import 'dart:math';" "$FILE" || \
              sed -i "1i import 'dart:math';" "$FILE"
          fi

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --no-pub
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms=android --no-pub
          fi

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Assistant-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
